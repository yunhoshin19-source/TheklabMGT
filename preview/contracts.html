<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계약관리 | THE KLAB MGT Preview</title><link rel="stylesheet" href="./demo.css"></head><body data-page="contracts"><header class="site-header" id="siteNav"></header><main class="wrap"><div class="page-head"><div><h1>계약관리</h1><p>계약 총액과 유지보수 월 청구액 분리 · 입금 계획 · 변경 이력 시연</p></div><div class="actions" id="headActions"></div></div><div class="demo-note" data-demo-notice></div><section class="panel"><h2>계약 목록</h2><div class="table-scroll"><table><thead><tr><th>계약번호</th><th>거래처</th><th>계약명</th><th>유형</th><th>총 계약금액</th><th>월 청구</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel" id="editPanel"><h2 id="formTitle">계약 등록</h2><form id="form"><div class="form-grid"><div class="field"><label>거래처 *</label><select id="partyId" required></select></div><div class="field"><label>계약 유형</label><select id="type"><option value="maintenance">유지보수</option><option value="project">프로젝트</option></select></div><div class="field"><label>상태</label><select id="status"><option value="draft">작성 중</option><option value="review">검토 중</option><option value="active">진행 중</option><option value="completed">종료</option><option value="terminated">해지</option></select></div><div class="field"><label>계약번호 *</label><input id="no" required></div><div class="field span-2"><label>계약명 *</label><input id="title" required></div><div class="field"><label>계약일 *</label><input id="signed" type="date" required></div><div class="field"><label>시작일 *</label><input id="start" type="date" required></div><div class="field"><label>종료일 *</label><input id="end" type="date" required></div><div class="field"><label>총 계약금액(공급가액) *</label><input id="contractAmount" type="number" min="0" required></div><div class="field" id="monthlyField"><label>월 청구금액(공급가액) *</label><input id="monthlyAmount" type="number" min="0"></div><div class="field" id="billDayField"><label>월 청구일</label><input id="billDay" type="number" min="1" max="31" value="10"></div><div class="field"><label>부가세 구분</label><select id="vat"><option value="taxable">과세</option><option value="exempt">면세</option><option value="not_applicable">해당 없음</option></select></div><div class="field"><label>자동갱신</label><select id="renew"><option value="false">아니오</option><option value="true">예</option></select></div><div class="field"><label>종료 전 알림(일)</label><input id="notice" type="number" min="0" value="30"></div><div class="field wide"><label>메모</label><textarea id="memo"></textarea></div><div class="field wide"><label>계약서 파일 시안 (파일 자체는 저장되지 않음)</label><input type="file" id="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"><p class="help" id="fileName"></p></div></div><div id="scheduleArea"><h3>프로젝트 입금 일정</h3><p class="help">입금 연결 일정은 예정금액 이하로 변경하거나 삭제할 수 없습니다.</p><div id="scheduleEntries"></div><button class="btn" type="button" id="addSchedule">＋ 일정 추가</button></div><div class="form-actions"><button type="button" class="btn" id="clear">신규 입력</button><button class="btn primary" type="submit">계약 저장</button></div><div id="message"></div></form></section><section class="panel" id="paymentPanel" hidden><h2>프로젝트 입금 일정 및 전표 연결</h2><div class="table-scroll"><table><thead><tr><th>일정</th><th>예정일</th><th>예정금액</th><th>입금 누계</th><th>미입금</th><th>상태</th><th>처리</th></tr></thead><tbody id="payments"></tbody></table></div></section><section class="panel" id="historyPanel" hidden><h2>계약 수정 이력</h2><div id="history" class="timeline"></div></section><p class="footnote">THE KLAB MGT · 공개 프리뷰 · 모든 금액 및 고객은 샘플 데이터입니다.</p></main><div class="modal-overlay" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-titlebar"><h2 id="modalTitle"></h2><button class="btn" type="button" data-close>닫기</button></div><div id="modalContent"></div></div></div><script src="./demo.js"></script><script src="./pages/contracts.js"></script></body></htm
