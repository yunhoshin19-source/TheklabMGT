<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회계전표 관리 | THE KLAB MGT Preview</title><link rel="stylesheet" href="./demo.css"></head><body data-page="vouchers"><header class="site-header" id="siteNav"></header><main class="wrap"><div class="page-head"><div><h1>회계전표 관리</h1><p>청구·입금·매입비용·지급 전표 등록 및 수정</p></div><div class="actions" id="headActions"></div></div><div class="demo-note" data-demo-notice></div><section class="panel"><h2 id="formTitle">전표 등록</h2><form id="form"><div class="form-grid"><div class="field"><label>구분</label><select id="type"><option value="billing">청구</option><option value="receipt">입금</option><option value="expense">매입·비용</option><option value="payment">지급</option></select></div><div class="field"><label>전표일자</label><input id="date" type="date" required></div><div class="field"><label>상태</label><select id="status"><option value="approved">확정</option><option value="draft">임시저장</option></select></div><div class="field span-2"><label>전표명</label><input id="title" required></div><div class="field"><label>공급가액(원)</label><input id="amount" type="number" min="0" required></div><div class="field"><label>거래처</label><select id="partyId"></select></div><div class="field"><label>연계 계약</label><select id="contractId"></select></div><div class="field"><label>부가세(원)</label><input id="vat" type="number" min="0" value="0"></div><div class="field"><label>세금계산서 발행</label><select id="invoice"><option value="false">미발행</option><option value="true">발행</option></select></div><div class="field wide"><label>영수증 파일 시안 (파일명만 기록)</label><input id="receiptFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"><span id="receiptName" class="help"></span></div><div class="field wide"><label>메모</label><textarea id="memo"></textarea></div></div><div class="form-actions"><button id="clear" class="btn" type="button">신규 입력</button><button class="btn primary" type="submit">전표 저장</button></div><div id=
