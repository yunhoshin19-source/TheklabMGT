name: Publish THE KLAB UI Preview
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
