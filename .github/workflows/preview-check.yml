name: Validate Preview Pages
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML / file links
        run: node preview/test.mjs
      - name: Validate preview JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in preview/demo.js preview/pages/*.js; do
            node --check "$file"
          done
