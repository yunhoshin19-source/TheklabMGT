<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사용자관리 | THE KLAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#213650;font-family:system-ui,"Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{background:#fff;border:1px solid #e0e8f3;border-radius:18px;padding:32px;box-shadow:0 14px 55px #20396114;width:min(100%,430px)}.brand{font-weight:900;font-size:28px;color:#13457e;margin:0 0 8px}.desc{font-size:13px;color:#8290a4;margin:0 0 28px}label{display:block;font-weight:750;font-size:12px;margin:0 0 7px}input,select{width:100%;padding:12px;border:1px solid #d6e0ed;border-radius:9px;margin-bottom:19px;background:white;color:#263c58}button{background:#1767d5;border:0;border-radius:9px;padding:13px;color:white;font-weight:750;width:100%}button:disabled{opacity:.55;cursor:wait}.message{font-size:12px;color:#be314d;min-height:22px}.foot{font-size:11px;color:#9aa6b5;margin-top:18px;line-height:1.65}</style><style>.layout{display:block;max-width:1040px;margin:auto}.panel{width:100%;max-width:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #e5ecf5}th{color:#60748d;background:#f8faff}.columns{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top button{width:auto}.status{font-size:12px;color:#7e8fa4}@media(max-width:700px){.columns{grid-template-columns:1fr}.layout{padding:12px}table{font-size:11px}}</style></head><body><main class="layout"><div class="panel"><div class="top"><div><h1 class="brand">사용자관리</h1><p class="desc">THE KLAB · 관리자 전용</p></div><div><button onclick="location.href='/index.html'">대시보드</button></div></div><p id="status" class="status">권한 확인 중…</p><section id="adminPanel" hidden><h3>사용자 등록</h3><form id="newUser"><div class="columns"><div><label>이메일</label><input id="email" type="email" required></div><div><label>이름</label><input id="name" required maxlength="100"></div><div><label>권한</label><select id="role"><option value="staff">일반 담당자</option><option value="manager">관리자급 담당자</option><option value="accountant">세무사 (읽기 전용 예정)</option><option value="admin">시스템 관리자</option></select></div><div><label>초기 비밀번호 (12자 이상)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"></div></div><button type="submit">사용자 추가</button><p id="message" class="message" role="alert"></p></form><h3>등록 사용자</h3><div style="overflow:auto"><table><thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="foot">실제 시스템 적용 전 비밀번호 재설정·초대 메일·MFA·개인정보 처리정책을 추가해야 합니다. 세무사 조회 권한은 향후 회계 API에 적용됩니다.</p></div></main><script>
const $=s=>document.getElementById(s);
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function refresh(){let d=await api('/api/users');$('rows').replaceChildren();d.users.forEach(u=>{const tr=document.createElement('tr');[u.name,u.email,u.role,u.isActive?'활성':'비활성'].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});const td=document.createElement('td');const btn=document.createElement('button');btn.style.width='auto';btn.textContent=u.isActive?'비활성화':'활성화';btn.onclick=async()=>{if(!confirm('사용자 상태를 변경할까요?'))return;try{await api('/api/users/'+u.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({isActive:!u.isActive})});await refresh()}catch(e){alert(e.message)}};td.append(btn);tr.append(td);$('rows').append(tr)})}
(async()=>{try{const d=await api('/api/me');if(d.user.role!=='admin'){location.replace('/index.html');return}$('adminPanel').hidden=false;$('status').textContent='관리자로 로그인: '+d.user.name;await refresh()}catch(e){location.replace('/login.html')}})();
$('newUser').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,name:$('name').value,role:$('role').value,password:$('password').value})});$('message').textContent='등록 완료';$('newUser').reset();await refresh()}catch(e){$('message').textContent=e.message}};
</script></body></html>
