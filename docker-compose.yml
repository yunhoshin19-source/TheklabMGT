services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-theklab}
      POSTGRES_USER: ${POSTGRES_USER:-theklab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theklab_app} -d ${POSTGRES_DB:-theklab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
  # The current frontend is a browser-only prototype.
  # An authenticated API service will be added before live database CRUD.
networks:
  backend:
volumes:
  postgres_data:
