<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | THE KLAB MGT</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#213650;font-family:system-ui,"Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{background:#fff;border:1px solid #e0e8f3;border-radius:18px;padding:32px;box-shadow:0 14px 55px #20396114;width:min(100%,430px)}.brand{font-weight:900;font-size:28px;color:#13457e;margin:0 0 8px}.desc{font-size:13px;color:#8290a4;margin:0 0 28px}label{display:block;font-weight:750;font-size:12px;margin:0 0 7px}input,select{width:100%;padding:12px;border:1px solid #d6e0ed;border-radius:9px;margin-bottom:19px;background:white;color:#263c58}button{background:#1767d5;border:0;border-radius:9px;padding:13px;color:white;font-weight:750;width:100%}button:disabled{opacity:.55;cursor:wait}.message{font-size:12px;color:#be314d;min-height:22px}.foot{font-size:11px;color:#9aa6b5;margin-top:18px;line-height:1.65}</style></head><body><main class="layout"><div class="panel"><h1 class="brand">THE KLAB</h1><p class="desc">계약 · 회계 통합 관리 시스템 로그인</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required placeholder="name@company.com"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호 입력"><div id="message" class="message" role="alert"></div><button id="submit" type="submit">로그인</button></form><p class="foot">계정은 관리자가 등록합니다. 이 화면은 API /api/login과 연동되며, API가 없는 정적 미리보기 환경에서는 로그인할 수 없습니다.</p></div></main><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{
e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;m.textContent='';
try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'로그인 실패');location.replace('/index.html')}catch(e){m.textContent=e.message||'로그인할 수 없습니다.'}finally{b.disabled=false}
});</script></body></html>
